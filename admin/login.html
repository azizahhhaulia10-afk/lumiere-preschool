<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Lumière Preschool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#EAF4FF,#DCEBFF);font-family:Nunito,sans-serif;color:#26364A;display:grid;place-items:center;padding:22px}
.login-wrap{width:min(100%,430px)}.brand{text-align:center;margin-bottom:22px}.brand-mark{width:64px;height:64px;border-radius:21px;background:#2455B5;color:white;display:grid;place-items:center;font:600 30px Fredoka,sans-serif;margin:0 auto 12px;box-shadow:0 12px 25px #2455b533}.brand h1{font:600 27px Fredoka,sans-serif;margin:0}.brand p{color:#68788B;margin:5px 0}
.card{background:#fff;border:1px solid #e1ebf8;border-radius:25px;padding:30px;box-shadow:0 18px 45px #2455b51a}.eyebrow{color:#2455B5;font-size:12px;letter-spacing:1.7px;font-weight:900}.card h2{font:600 28px Fredoka,sans-serif;margin:8px 0}.intro{font-size:14px;color:#68788B;line-height:1.7;margin:0 0 22px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd9ec;border-radius:12px;padding:13px 14px;font:600 15px Nunito;color:#26364A;outline:none}.field input:focus{border-color:#4D83DB;box-shadow:0 0 0 3px #4d83db20}.password-row{display:flex;gap:8px}.password-row input{flex:1;min-width:0}.show{border:1px solid #cbd9ec;background:#f5f9ff;border-radius:12px;padding:0 12px;color:#2455B5;font-weight:900;cursor:pointer}.submit{width:100%;border:0;border-radius:30px;background:#2455B5;color:#fff;padding:14px;font:900 15px Nunito;cursor:pointer;margin-top:9px}.submit:hover{background:#1c469b}.error{display:none;background:#fff0f0;color:#a52c37;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:13px}.demo{margin-top:19px;background:#F1F6FF;border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.7;color:#53657b}.demo strong{color:#2455B5}.back{display:block;text-align:center;margin-top:18px;color:#2455B5;text-decoration:none;font-weight:900;font-size:13px}
</style></head>
<body><main class="login-wrap">
<div class="brand"><div class="brand-mark">L</div><h1>Lumière Preschool</h1><p>Admin Panel</p></div>
<section class="card"><span class="eyebrow">WELCOME BACK</span><h2>Admin Login</h2><p class="intro">Masuk untuk melihat dashboard simulasi pengelolaan website Lumière Preschool.</p>
<form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Masukkan username" required></div>
<div class="field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button class="show" type="button" id="togglePassword">Lihat</button></div></div>
<button class="submit" type="submit">Sign In</button><div class="error" id="error" role="alert">Username atau password belum tepat. Silakan coba lagi.</div></form>
<div class="demo"><strong>Demo account</strong><br>Username: <b>admin</b><br>Password: <b>lumiere2026</b></div></section>
<a class="back" href="../index.html">← Back to Website</a>
</main>
<script>
document.getElementById('togglePassword').addEventListener('click',()=>{const p=document.getElementById('password');const show=p.type==='password';p.type=show?'text':'password';document.getElementById('togglePassword').textContent=show?'Sembunyikan':'Lihat'});
document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;if(u==='admin'&&p==='lumiere2026'){sessionStorage.setItem('lumiereDemoAdmin','true');location.href='dashboard.html'}else{document.getElementById('error').style.display='block'}});
</script></body></html>
